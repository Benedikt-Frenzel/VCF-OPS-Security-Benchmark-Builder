name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python unit tests + baseline regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests and baseline regression (includes rules-in-sync check)
        run: python3 -m unittest discover -s test -v

      - name: Freshness - regenerating rules.js must be a no-op
        run: |
          python3 tools/build_rules.py --csv data/decision-matrix.csv --out rules.js
          git diff --exit-code -- rules.js

  node:
    name: Node jsdom page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Run page tests
        run: node --test
